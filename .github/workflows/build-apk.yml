name: Build Zaghlol Player TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          "$AAPT" dump badging "$APK" | grep -E "^(package|application|launchable-activity)"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaghlol-player-tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Zaghlol Player for Android TV v1.0.0
          body: |
            Zaghlol Player for Android TV v1.0.0 — same UI and functions as the Windows v2.0.3 player, rebuilt for the TV (D-pad remote, 10-foot UI):
            - Live TV: top bar (Z logo + tabs + search), categories sidebar with real counts, channels with red LIVE badges, video info bar with real now/next EPG, bottom now-playing bar with progress and time.
            - Movies/Series: header with count badge, category chips, poster grids with gradient title tiles as fallback when a cover is missing, resume support, season/episode picker for series.
            - 7-day EPG guide (Xtream catch-up included), favorites, recents, saved logins with auto-login.
            - Login: M3U link, M3U file, Xtream Codes, or free demo channels. Connection test on the login forms with real Arabic error messages.
            - Playback: HLS via ExoPlayer (Media3). M3U VOD entries are classified into Movies, series markers into Series.
            The player contains no channels — use your own legal IPTV playlist/subscription.
            Sideload the APK on your Android TV (Downloader app, USB stick, or Send Files to TV).
          files: |
            app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
