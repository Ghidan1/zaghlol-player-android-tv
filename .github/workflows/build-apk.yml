name: Build Zaghlol Player TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          "$AAPT" dump badging "$APK" | grep -E "^(package|application|launchable-activity)"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaghlol-player-tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release v1.0.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: Zaghlol Player for Android TV v1.0.3
          body: |
            Zaghlol Player for Android TV v1.0.3 — fixes a loading-strategy regression from v1.0.2:
            - Progressive loading: the app now enters as soon as LIVE TV is ready, instead of waiting for all 6 catalogue calls behind one 90-second global timeout. On a slow panel the sequential big lists took longer than 90s in total, so v1.0.2 counted the full 90 seconds and then failed the login — even though live TV was already usable. There is no global login timeout any more (each call has its own generous 60s timeout + one retry), and the login screen has a Cancel button.
            - Movies and series load in the background after entry, each independently with its own loading state and retry button. A failure in one section never blocks the others and never kicks you back to login — the tabs show "loading..." until their real counts arrive.
            - M3U playlists now stream-parse while downloading, line by line, instead of buffering the whole file first — the panel resets huge downloads ("Connection reset"), and the old full-download approach died before a single channel was seen. One full retry on failure; if it still fails, the error plainly says to try Xtream login instead (the proven-working path on this panel).
            - Kept from v1.0.2: fallback categories rebuilt from loaded items, case-insensitive matching, D-pad focus (Live tab focuses the first category, Movies/Series focus the first poster), and HLS → progressive .ts fallback on player error. Background VOD/series merges no longer yank the Live focus back to "All".
            Everything else is unchanged from v1.0.2 (including the cleartext-HTTP fix for HTTP-only panels):
            - Live TV: top bar (Z logo + tabs + search), categories sidebar with real counts, channels with red LIVE badges, video info bar with real now/next EPG, bottom now-playing bar with progress and time.
            - Movies/Series: header with count badge, category chips, poster grids with gradient title tiles as fallback when a cover is missing, resume support, season/episode picker for series.
            - 7-day EPG guide (Xtream catch-up included), favorites, recents, saved logins with auto-login.
            - Login: M3U link, M3U file, Xtream Codes, or free demo channels. Connection test on the login forms with real Arabic error messages.
            - Playback: HLS via ExoPlayer (Media3). M3U VOD entries are classified into Movies, series markers into Series.
            The player contains no channels — use your own legal IPTV playlist/subscription.
            Sideload the APK on your Android TV (Downloader app, USB stick, or Send Files to TV).
          files: |
            app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
